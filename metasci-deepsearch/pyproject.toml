[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metasci-deepsearch"
version = "0.1.0"
description = "CiteFlow-based deep academic search for MetaScientist"
requires-python = ">=3.10"
dependencies = [
    "metasci-universe",
    "openai>=1.0",
    "httpx>=0.25",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metasci_deepsearch"]
