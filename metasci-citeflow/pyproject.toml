[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metasci-citeflow"
version = "0.1.0"
description = "CiteFlow deep literature search as composable agent-native tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "metasci-universe",
    "openai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
keywords = ["spacy>=3.7"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/metasci_citeflow"]
artifacts = ["src/metasci_citeflow/llm/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
